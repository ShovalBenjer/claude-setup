<!doctype html>
<meta charset="utf-8">
<title>Session Lens</title>
<!-- Palette anchor: docs/taste.md 2026-08-13 kitty pick (Kanagawa dragon base,
     wave accents boosted). One system with the terminal, not a web-app skin. -->
<style>
  :root { --bg:#12120F; --panel:#1A1A16; --fg:#DCD7BA; --dim:#9E9B93;
          --gold:#E6C384; --rose:#E46876; --leaf:#98BB6C; --wave:#7FB4CA; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 "JetBrains Mono","Cascadia Mono",monospace;
         padding:2rem; max-width:70rem; margin:auto }
  h1 { font-size:1rem; letter-spacing:.3em; color:var(--gold); text-transform:uppercase }
  h1::before { content:"◤ "; color:var(--rose) }
  #ledgers { display:flex; gap:1.5rem; margin:1rem 0 2rem; color:var(--dim); flex-wrap:wrap }
  #ledgers b { color:var(--wave); font-weight:normal }
  .s { background:var(--panel); border-left:3px solid var(--dim); padding:.7rem 1rem;
       margin-bottom:.5rem; display:grid; grid-template-columns:11rem 1fr auto; gap:1rem;
       align-items:baseline; overflow-x:auto }
  .s.active { border-left-color:var(--leaf) }
  .s.needs  { border-left-color:var(--gold); background:#201d13 }
  .s.needs .tag { color:var(--gold) }
  .proj { color:var(--wave); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .last { color:var(--dim); font-size:12.5px; max-height:3em; overflow:hidden }
  .tag  { color:var(--dim); white-space:nowrap; font-size:12px }
  .s.active .tag { color:var(--leaf) }
  #empty { color:var(--dim); padding:2rem 0 }
  footer { margin-top:2rem; color:#5a5850; font-size:11px }
</style>
<h1>Session Lens</h1>
<div id="ledgers">connecting…</div>
<div id="list"></div>
<div id="empty" hidden>no transcripts touched in the last 3 days</div>
<footer>a lens over ~/.claude transcripts and state/*.jsonl · owns nothing · SSE 2s</footer>
<script>
const fmtAge = s => s<60 ? s+"s" : s<3600 ? Math.floor(s/60)+"m" : Math.floor(s/3600)+"h";
function render(d){
  const lg = d.ledgers||{}, g = lg["gate-runs.jsonl"]||{};
  document.getElementById("ledgers").innerHTML =
    `gate <b>${g.last_verdict||"?"}</b>${g.blocking?` (${g.blocking.join(", ")})`:""}` +
    ` · gate rows <b>${g.rows||0}</b>` +
    ` · skill uses <b>${(lg["skill-use.jsonl"]||{}).rows||0}</b>` +
    ` · agent spawns <b>${(lg["agent-spawns.jsonl"]||{}).rows||0}</b>`;
  const list = document.getElementById("list");
  const rows = d.sessions||[];
  document.getElementById("empty").hidden = rows.length>0;
  list.innerHTML = rows.map(r=>`
    <div class="s ${r.active?"active":""} ${r.needs_you?"needs":""}">
      <span class="proj">${r.project}</span>
      <span class="last">${r.last?r.last.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])):"·"}</span>
      <span class="tag">${r.needs_you?"◆ needs you":r.active?"● active":"○ "+fmtAge(r.age_s)}</span>
    </div>`).join("");
}
const es = new EventSource("/events");
es.onmessage = e => render(JSON.parse(e.data));
es.onerror = () => document.getElementById("ledgers").textContent = "reconnecting…";
</script>

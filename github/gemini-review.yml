name: Gemini PR Review (2nd model)

# The decorrelated second reviewer (ADR-0004/0007): a different model FAMILY (Google
# Gemini) reviews independently, never seeing Claude's review. Free AI Studio tier.
# Needs repo secret GEMINI_API_KEY. Runs alongside claude-code-review.yml so each PR
# gets two independent family reviews -> the agreement gate compares them.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Gemini independent review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          [ -z "$GEMINI_API_KEY" ] && { echo "GEMINI_API_KEY not set; skipping"; exit 0; }
          DIFF=$(gh pr diff "$PR" --repo "$REPO" | head -c 60000)
          PROMPT=$(cat <<EOF
          You are an independent PR reviewer (Gemini). Review this diff for: (1) correctness
          bugs, (2) security (anchor to OWASP/CWE), (3) contract/boundary violations, (4)
          performance, (5) maintainability. Rules: cite evidence from the diff per finding
          or mark "Possible issue"; fixes <=15 lines or cite a library; tiered severity
          (Critical/High/Medium/Low); max 5 nits. Output markdown. Do not assume another
          reviewer's findings.

          DIFF:
          $DIFF
          EOF
          )
          RESP=$(GEMINI_API_KEY="$GEMINI_API_KEY" python .github/scripts/gemini_call.py "$PROMPT")
          BODY=$(printf '## Gemini independent review (2nd model)\n\n_provenance: gemini-2.5-flash, decorrelated from Claude, ADR-0004._\n\n%s' "$RESP")
          gh pr comment "$PR" --repo "$REPO" --body "$BODY"

[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"
description = "Session dashboard Tauri shell (DASH-1). Requires GTK/webkit2gtk dev packages via pkg-config: `libgtk-3-dev`, `libwebkit2gtk-4.1-dev`, `libayatana-appindicator3-dev`, and `librsvg2-dev` (Tauri v2 Linux prerequisites)."

[lib]
name = "dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dashboard-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "dashboard"
path = "src/main.rs"

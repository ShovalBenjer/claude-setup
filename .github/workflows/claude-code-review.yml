name: Claude Code Review

# Always-fresh review: `synchronize` fires on EVERY push to the PR branch, and the
# concurrency group cancels any in-flight review so each push starts a fresh one
# (workflow equivalent of "@claude review always" on a Manual-mode repo).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; reviews restart when marked ready
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every run since at least 2026-08-05 has posted "Claude encountered an error
      # after ~40s" to the PR and exited 1, with the underlying error swallowed by the
      # action. Four theories were tested and discarded before adding this: the OAuth
      # secret exists (set 2026-07-23), the action resolves, the repo ships no
      # project-level .claude/settings.json so its own Stop hooks are not blocking the
      # reviewer, and the action completes its GitHub-side work (it posts and updates
      # the comment) before failing. ANTHROPIC_LOG surfaces the API-level error so the
      # next red run names its own cause instead of needing a fifth theory.
      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_LOG: debug
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Gastown's Polecat agents open their PRs as kilo-code-bot, and the action
          # refuses a non-human actor by default, so every bot PR failed at the
          # trigger check ("Workflow initiated by non-human actor") and the bead
          # waiting on that review burned its 5 dispatch attempts. Named explicitly
          # rather than '*': the point is to admit this one known writer, not to let
          # any bot that ever opens a PR here spend review budget.
          allowed_bots: kilo-code-bot
          track_progress: true
          prompt: |
            Perform a fresh, full review of this PR (do not assume prior reviews).
            Focus, in order: (1) correctness bugs that break behavior, (2) security
            (anchor findings to OWASP/CWE where applicable), (3) contract/boundary
            violations (typed DTOs, unchecked errors at IO edges), (4) performance,
            (5) maintainability. Rules:
            - Cite evidence from the diff for every finding, or mark it "Possible issue".
            - Fix suggestions must be <=15 lines or cite a library/utility.
            - Tiered depth: Critical/High get code snippets; Low gets one line.
            - Max 5 nits; count the rest in the summary.
            - Do not report style that CI already enforces.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 10

name: Nightly autonomy (pilot, AUTO-07)

# The cloud rail: runs with the laptop off, on the subscription token (ADR-0002).
# Structural safety (ADR-0012), verified 2026-07-24 against three failure modes:
#   1. The agent step has NO Bash — it edits files only; every git/gh action happens
#      in deterministic shell steps below, and the only push is branch-scoped auto/*.
#      There is no code path that touches main (branch protection is unavailable on
#      a private free-plan repo, so the structure IS the guard).
#   2. Cap fails CLOSED: gh error => 999 => skip. Counted by auto/* branch prefix,
#      not by label (labels depend on model compliance; prefixes don't).
#   3. Review is guaranteed in-run: a second job reviews the PR in this same
#      workflow, so the GITHUB_TOKEN no-trigger rule can't silence the fabric.
#      (claude-code-review.yml + gemini-review.yml also fire on human synchronize
#      events. gemini-review.yml was written 2026-07-31 and has NEVER RUN, so it
#      is not yet evidence of anything; it is also advisory and cannot block.)
on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC nightly
  workflow_dispatch: {}

concurrency:
  group: claude-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Cap check (max 3 open auto/* PRs, fail closed)
        id: cap
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          OPEN=$(gh pr list --state open --json headRefName \
            --jq '[.[]|select(.headRefName|startswith("auto/"))]|length' || echo 999)
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          echo "Open auto/* PRs: $OPEN"

      - name: Branch for tonight
        if: ${{ steps.cap.outputs.open < 3 }}
        run: git checkout -b "auto/nightly-$(date -u +%Y%m%d)"

      - name: Nightly maintenance pass (file edits only, no Bash)
        if: ${{ steps.cap.outputs.open < 3 }}
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            You are the nightly autonomy run (AUTO-07, ADR-0012) for this repo.
            Read TODO.md, tools/selfimprove/proposals.jsonl, and state/lessons.jsonl.
            Pick ONE low-risk item (docs drift, missing test for a tool, dead code,
            lint, an open lesson's enforcement artifact). Implement it completely by
            EDITING FILES ONLY — you have no shell; a later step commits and opens
            the PR. Write a PR body to .github/NIGHTLY_PR_BODY.md: what/why, how to
            verify, and which proposal/lesson id it advances. If nothing qualifies,
            change no files.
          claude_args: "--max-turns 40"

      - name: Commit, push branch, open labeled PR
        if: ${{ steps.cap.outputs.open < 3 }}
        id: pr
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -e
          git config user.name "claude-nightly[bot]"
          git config user.email "nightly@users.noreply.github.com"
          BODY=".github/NIGHTLY_PR_BODY.md"
          [ -f "$BODY" ] && BODYARG=(--body-file "$BODY") || BODYARG=(--body "Nightly autonomy pass (AUTO-07). See diff.")
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes tonight; no PR."; echo "pr=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git add -A && git commit -m "auto(nightly): maintenance pass $(date -u +%Y-%m-%d)"
          git push origin "HEAD"
          gh label create autonomy --color 6f42c1 --description "opened by the autonomy loop" 2>/dev/null || true
          URL=$(gh pr create --label autonomy --title "auto(nightly): $(date -u +%Y-%m-%d)" "${BODYARG[@]}")
          echo "pr=${URL##*/}" >> "$GITHUB_OUTPUT"
          echo "Opened PR: $URL"

  review-own-pr:
    needs: nightly
    if: ${{ needs.nightly.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: In-run review (GITHUB_TOKEN PRs never trigger pull_request workflows)
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            Review PR #${{ needs.nightly.outputs.pr }} in this repo with fresh eyes
            (you did not write it). Post a review comment via gh: correctness,
            contract/boundary violations, scope creep beyond ONE low-risk item,
            missing verification evidence in the PR body. Tiered severity. If the
            change exceeds low-risk class, say so explicitly — it must NOT be
            auto-merged (ADR-0012 merge policy).
          claude_args: '--max-turns 15 --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr comment:*)"'
